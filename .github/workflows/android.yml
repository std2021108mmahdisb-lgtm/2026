name: Build Signed Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/tawzee-release.jks

          test -s android/app/tawzee-release.jks
          chmod 600 android/app/tawzee-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          android = re.search(r'\bandroid\s*\{', s)
          if not android:
              raise SystemExit("Android block not found")

          if "signingConfigs {" in s:
              raise SystemExit("Signing configuration already exists")

          signing = """
              signingConfigs {
                  release {
                      storeFile file("tawzee-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          s = s[:android.end()] + signing + s[android.end():]

          build_types = re.search(r'\bbuildTypes\s*\{', s)
          if not build_types:
              raise SystemExit("buildTypes block not found")

          release = re.search(r'\brelease\s*\{', s[build_types.end():])
          if not release:
              raise SystemExit("release block not found")

          pos = build_types.end() + release.end()
          s = s[:pos] + "\n            signingConfig signingConfigs.release\n" + s[pos:]

          p.write_text(s)
          print("Release signing configured successfully")
          PY

      - name: Build signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          rm -f android/app/tawzee-release.jks

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tawzee-altaheen-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
